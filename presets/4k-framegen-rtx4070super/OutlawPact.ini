[Gang]
MaxMembers=4
; Hard limit for paid capacity upgrades (1..12).
MaximumCapacity=12
MemberHealth=450
StarterWeapon=1
CopyClothing=1

[Interface]
; Native lightweight panel is the default. 1 opts into the legacy Windows image overlay.
UseImagePanel=0
; Native transitions change only geometry/color; no Windows uploads.
Animations=1

[Recruitment]
; Percentages; remaining percentage is the chance of informing the law.
Accept=50
Refuse=25
Flee=15

[Features]
; Civilian robberies only. Hostage negotiation and bank integration are excluded.
EnableRobbery=1

[Progress]
; Upgrades, reputation and stored guns are saved in a mod profile.
; Use different profile names for different saves (letters, numbers, _ and -).
Profile=main

[Controls]
; Letters, F1..F24, Insert, Home, End, Delete, PageUp, PageDown, or 0xNN.
; NONE disables recruitment/command hotkeys. Menu cannot be disabled.
; Recruitment and commands can share a key; the target decides the action.
; A key equal to MenuKey disables the conflicting recruit/command action.
; Navigation keys are reserved. Invalid keys fall back to F7/G/G.
MenuKey=F8
RecruitKey=G
CommandKey=G
UpKey=UP
DownKey=DOWN
ConfirmKey=ENTER
BackKey=BACKSPACE
NumpadNavigation=1
; Avoid contextual wagon controls by ignoring interaction hotkeys in vehicles.
InteractInVehicles=0

[Behaviour]
FollowDistance=2.0
FollowSpeed=2.0
CollectWeapons=1
LootRadius=9.0

[Combat]
AutoDefend=1
BaseAccuracy=35
Movement=1
Range=2
DefenceRadius=35.0

[Camp]
; Animated visual flag. Requires windowed/borderless. Image: OutlawPact/assets/flag.png
CustomFlag=0
FlagDrawDistance=55.0
Enabled=1
IdleActivities=1
InteractionRadius=18.0
; Saved camps are rebuilt only when the player is near the saved location.
RestoreRadius=250.0
; Moderate mountain slopes and smooth curved terrain are allowed.
MaxSlopeDegrees=32.0
MaxUnevenness=0.35
MaxFoundationGap=0.25
SiteSearchRadius=2.0

[Reputation]
Enabled=1
RobberyGain=5
RecognitionThreshold=15
RecruitmentBonusDivisor=10
RecognitionIntervalSeconds=90

[Persistence]
; World snapshots are separate from Rockstar saves, under the named mod profile.
SaveGang=1
SaveCamp=1
AutosaveSeconds=10

[Compatibility]
; Yield without resetting tasks/health when an external group takes a member.
YieldToExternalGroups=1
; Comma-separated model names or 0xHASH values; these cannot be recruited/restored.
ExcludedModels=
