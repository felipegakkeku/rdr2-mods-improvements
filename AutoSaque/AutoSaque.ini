; AutoSaque v2.0: saque automático de corpos humanos à distância sem animação (ou com animação).
; Compatível com PDO Reloaded (ignora NPCs agonizando até morrerem de fato).
; Fonte e compilação em _mod-lab\AutoSaque. Log em scripts\AutoSaque.log.
[Geral]
Ligado=1
; F7 liga e desliga durante o jogo; F10 alterna entre modo rápido (sem animação) e animação
TeclaLigar=F7
TeclaModo=F10
; rapido = saqueia de longe sem animação (dinheiro + munição direto no HUD nativo da Rockstar)
; animacao = o personagem faz o saque normal do jogo ao encostar no corpo
Modo=rapido
; metros até o corpo quando Modo=animacao
Distancia=2.5
; raio de checagem de inimigos quando PermitirEmCombate=0
RaioHostil=35
; 0 = saqueia qualquer corpo morto no raio; 1 = só quem você (ou seu cavalo) matou/alvejado
SoQuemEuMatei=0
AceitarSemAutor=1
; 0 = usa apenas os ícones nativos de +$ e +munição no canto direito; 1 = mostra legenda extra embaixo
Avisar=0
TimeoutMs=9000
IntervaloMs=250

[Rapido]
; alcance em metros para o saque à distância sem animação
Raio=35
; 1 = saqueia mesmo montado a cavalo
PermitirMontado=1
; 1 = saqueia imediatamente durante o tiroteio assim que o inimigo morre
PermitirEmCombate=1
; centavos sorteados quando o corpo ainda não gerou tabela de bolso (45-250 = $0.45 a $2.50)
DinheiroSeVazio=45-250
; balas adicionadas por corpo saqueado (da arma do inimigo ou da arma atual do jogador)
Municao=4-10

[Teste]
; 1 = F12 cria um corpo de teste a 6m à frente para validar o saque imediato
ModoTeste=0
TeclaTeste=F12
Modelo=a_m_m_valtownfolk_01
LogDetalhado=1
