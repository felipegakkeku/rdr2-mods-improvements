; GoreVisceral v1.0: Gore arterial, poças dinâmicas, explosão craniana e impulso Euphoria por osso.
; 100% compatível com enRAGE (BulletImpact X-Ray) e PDO Reloaded (não limpa GET_PED_LAST_DAMAGE_BONE).
[Geral]
Ligado=1
; Tecla opcional para ligar/desligar em jogo (ex.: None, F6, End)
TeclaLigar=None
LogDetalhado=0

[Particulas]
; Multiplicador global de névoa de sangue e fragmentos no impacto da bala (1.0 = original)
EscalaImpacto=1.85
; Multiplicador de distância de visibilidade das partículas de impacto
EscalaLodImpacto=2.0

[Sangue]
; Ativa jatos arteriais nativos da RAGE (_SET_PED_ACTIVATE_WOUND_EFFECT) em pescoço, cabeça e tórax alto
JatoArterial=1
PressaoArterial=1.65
; Gera poças dinâmicas de sangue sob corpos feridos/mortos e rastros de respingos no solo
PocasDinamicas=1
TamanhoPoca=1.45

[Desmembramento]
; Aciona desmembramento craniano (EXPLODE_PED_HEAD) em tiros fatais na cabeça até a distância máxima
ExplodirCabeca=1
DistanciaMaxCabeca=28.0

[Fisica]
; Aplica impulso cinético direcional exatamente no osso atingido (Euphoria)
ImpulsoPorOsso=1
ForcaImpulso=2.8
