[Probe]
; Tecla que dispara a sonda (nomes do System.Windows.Forms.Keys). F10/F11 já são do NemesisMod.
; F9 com todas as seções concluídas recomeça do zero.
RunKey=F9
; Roda sozinha quando o jogador fica controlável no modo história, só as seções ainda não concluídas.
AutoRun=True
; Segundos com o jogador controlável antes de começar.
AutoRunDelay=15
; Prints da janela do jogo em scripts\NativeProbe-shots\<data-hora>\.
Shots=True
; Liga/desliga cada seção. Ordem fixa por risco: UIFEED, ANIMSCENE, COMPANION, GUARDZONE, PERSCHAR.
UiFeed=True
AnimScene=True
Companion=True
GuardZone=True
PersChar=True

[PersChar]
; Quantos peds persistentes achados por perto têm o handle conferido (valido, ped de volta, morto).
CheckMax=5
; Vazio = não cria nada. Com um nome, tenta _CREATE_PERSISTENT_CHARACTER(GET_HASH_KEY(nome)), spawna, some e apaga.
CreateName=

[GuardZone]
; NPC criado como guarda (e como alvo do teste de COMPANION). O jogador fica parado e o guarda é levado até ele por faixas.
PedModel=s_m_m_valdeputy_01

[AnimScene]
; Dicionários tirados da memória do jogo com _mod-lab\memstr (strings script@...), separados por ";".
; "dicionario|playlist" fixa a playlist na criação; sem ela vai nula, como nos scripts do jogo.
; O último é um dicionário de animação comum (controle negativo: não deve criar cena).
Candidates=script@camp_upgrade@clemens_cove;script@camp_upgrade@horseshoe_overlook;script@camp_upgrade@shady_bell;script@common@cnv_camp@grief@knockout@knockout;script@common@cnv_camp@grief@tent@tentgrief;script@mech@crafting_fallbacks@craft_bullets_explosive;script@mech@crafting_fallbacks@craft_bullets_split;script@mech@crafting_fallbacks@craft_fire_bottle;script@mech@crafting_fallbacks@craft_improved_arrows;script@mech@crafting_fallbacks@craft_improved_tomahawk;script@mech@crafting_fallbacks@craft_modify_arrows;script@mech@crafting_fallbacks@craft_poison_throwingknives;script@mech@crafting_fallbacks@craft_throwingknives_improved;script@mech@crafting_fallbacks@craft_volatile_dynamite;script@rcm@rch1@leadin@rsc1@base;script@rcm@rch1@leadin@rsc1@leadin_front;script@rcm@rch1@leadin@rsc1@leadin_left;script@story@fin3@arthurs_grave;script@story@sal1@ig@sal1_ig12_wake_up@sal1_ig12_wake_up;mech_inventory@clothing@bandana
; Playlists achadas na memória (PBL_...); cada uma é testada com _DOES_ANIM_SCENE_PLAY_LIST_EXIST em cada cena criada.
Playlists=PBL_BASE;PBL_DROP_IN;PBL_DUMP;PBL_ENTER;PBL_EXIT_INDEX;PBL_EXIT_SECTION;PBL_FLIP_L1;PBL_FLIP_R1;pbl_griefing_ko_back_leadin;pbl_griefing_ko_back_noleadin;pbl_griefing_ko_front;PBL_LEVEL_2;PBL_LEVEL_3;PBL_LEVEL_4
; Cena tocada no próprio jogador depois do inventário (vazio = não toca). Roles = nomes de papel tentados um por vez.
PlayDict=script@mech@crafting_fallbacks@craft_fire_bottle;script@story@fin3@arthurs_grave;script@common@cnv_camp@grief@tent@tentgrief;script@common@cnv_camp@grief@knockout@knockout
